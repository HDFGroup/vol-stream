name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Build and smoke-test against HDF5 develop.
  #
  # Only develop is tracked -- older releases are not a support target, so the
  # matrix's job is catching drift against HEAD (H5VL_VERSION is 3 today and
  # will move again), not cross-version compatibility.
  #
  # This job already builds HDF5 with -DHDF5_ENABLE_PARALLEL=ON and installs
  # MPI (both legs of the matrix), so it is also where M6's collective-step /
  # parallel-writer test (ctest target "parallel") runs -- no separate job
  # needed, and it gets exercised against both mpich and openmpi for free,
  # matching this matrix's own rationale below about MPI implementations
  # differing in practice.
  # ---------------------------------------------------------------------------
  build:
    name: hdf5 ${{ matrix.hdf5 }} / ${{ matrix.mpi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - hdf5: develop
            mpi: mpich
          # Intercommunicator and dynamic-process behaviour differ between MPI
          # implementations in practice, so both are tested from the start.
          - hdf5: develop
            mpi: openmpi

    steps:
      - uses: actions/checkout@v4

      # Ubuntu's packaged MPICH (4.2.0 as of this runner image) hits a
      # CI-only bug: hydra_pmi_proxy configures each child's PMI bootstrap
      # correctly (confirmed via a diagnostic printout of PMI_RANK/SIZE/FD/
      # PORT from inside the child, before MPI_Init() runs -- see git log
      # for test/run_parallel_test.sh's own investigation, six-plus rounds
      # of mpiexec flags/env-vars), but the handshake itself silently fails
      # regardless of which of MPICH's two bootstrap mechanisms is used
      # (PMI_PORT: the child's connect() to the runner's own hostname:port
      # fails; PMI_FD: a pre-connected fork-inherited descriptor, also
      # fails, differently). Every rank then falls back to MPICH's
      # documented singleton-init behavior -- MPI_COMM_WORLD size 1, no
      # error, just silently wrong. This machine's own MPICH 5.0.0 (built
      # from source, same distro family) has never reproduced this in any
      # configuration tried, which is the signature of a version-specific
      # upstream bug rather than an environment/flag problem -- so build
      # MPICH 5.0.0 from source here instead of relying on the distro
      # package, sidestepping it entirely rather than continuing to chase
      # workarounds for 4.2.0's hydra.
      - name: Install build dependencies
        run: |
          # The runner image preinstalls an azure-cli apt source that is
          # unrelated to anything this build needs and has started 403ing
          # ("no longer signed"), which fails the whole `apt-get update`
          # and takes down every package below it with it. Drop it rather
          # than chase Microsoft's repo signing.
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list \
            /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          if [ "${{ matrix.mpi }}" = "mpich" ]; then
            curl -sSL https://www.mpich.org/static/downloads/5.0.0/mpich-5.0.0.tar.gz | tar xz
            cd mpich-5.0.0
            ./configure --prefix=/usr/local --with-device=ch3 --enable-shared --disable-fortran
            make -j"$(nproc)"
            sudo make install
            sudo ldconfig
            cd ..
            mpiexec --version
          else
            sudo apt-get install -y openmpi-bin libopenmpi-dev
          fi
          sudo apt-get install -y cmake ninja-build zlib1g-dev

      - name: Build HDF5 ${{ matrix.hdf5 }}
        run: |
          git clone --depth 1 --branch ${{ matrix.hdf5 }} \
            https://github.com/HDFGroup/hdf5.git hdf5-src
          cmake -S hdf5-src -B hdf5-build -G Ninja \
            -DCMAKE_INSTALL_PREFIX=$PWD/hdf5-install \
            -DCMAKE_BUILD_TYPE=Release \
            -DHDF5_ENABLE_PARALLEL=ON \
            -DBUILD_TESTING=ON \
            -DHDF5_TEST_API=ON \
            -DHDF5_BUILD_TOOLS=ON \
            -DHDF5_BUILD_EXAMPLES=OFF \
            -DHDF5_BUILD_FORTRAN=OFF \
            -DHDF5_BUILD_CPP_LIB=OFF \
            -DHDF5_ENABLE_ZLIB_SUPPORT=ON
          cmake --build hdf5-build --parallel
          cmake --install hdf5-build

      - name: Report H5VL_VERSION
        run: |
          grep -E "define H5VL_VERSION" hdf5-install/include/H5VLpublic.h || true

      - name: Build vol-stream
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_PREFIX_PATH=$PWD/hdf5-install \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DVOL_STREAM_H5DIFF=$PWD/hdf5-install/bin/h5diff
          cmake --build build --parallel

      - name: Smoke test
        run: ctest --test-dir build --output-on-failure

      # -----------------------------------------------------------------------
      # The M0 exit gate. Runs HDF5's own API suite natively and through the
      # connector and requires the two to be indistinguishable -- not merely
      # that the connector run passes, since a pass silently becoming a skip is
      # exactly the regression this is meant to catch.
      # -----------------------------------------------------------------------
      - name: API conformance gate
        run: |
          ./test/run_api_suite.sh \
            --api-bin  $PWD/hdf5-build/bin \
            --plugin-dir $PWD/build \
            --outdir  $PWD/api-results

      - name: Upload API suite logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-results-${{ matrix.hdf5 }}-${{ matrix.mpi }}
          path: api-results/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # M4: Mercury transport, Margo progress, deferred I/O.
  # M5: Flock rendezvous and late joiners (SSG through M10; SSG was
  # deprecated by its own maintainers and migrated off -- see tr_mercury.c
  # and CMakeLists.txt's version-floor comment).
  # M7: queue policy and BAKE spill (M6 needs no transport -- it rides the
  # main `build` job's parallel HDF5 instead, see that job's own comment).
  # M8 (first increment): subscription protocol -- Mercury's first RPC
  # carrying actual payload bytes, not just control-plane scalars.
  #
  # mercury, argobots, mochi-margo, mochi-thallium, mochi-flock,
  # mochi-abt-io and mochi-bake are not Ubuntu packages, so build them from
  # source -- the exact versions verified locally: argobots 1.2, mercury
  # 2.4.1 (+sm +ofi), mochi-margo 0.24.2 (CMake as of this release, not
  # autotools -- see below), mochi-thallium 0.17.1 (flock's C++ dependency;
  # needs only cereal, apt-installed as libcereal-dev), mochi-flock main
  # (0.8.0 plus an unreleased group-file race fix; see its step),
  # mochi-abt-io 0.9.0, mochi-bake 0.6.4. margo and flock floors are
  # enforced again at vol-stream's own configure time
  # (CMakeLists.txt: margo >= 0.24.2, flock >= 0.8.0) because older
  # releases build and link fine and fail only at run time.
  #
  # PMDK 2.1.1 is a real, heavier dependency (BAKE's build hard-requires
  # libpmemobj) -- Ubuntu does not package a version new enough either, so it
  # is also built from source. NDCTL_ENABLE=n skips its libndctl/libdaxctl
  # RAS-hardware-failure-detection integration, which is irrelevant here:
  # BAKE's file backend (see the vol-stream build step below) never touches
  # real persistent-memory hardware, just a regular node-local file.
  # PMEMOBJ_IGNORE_DIRTY_SHUTDOWN/PMEMOBJ_IGNORE_BAD_BLOCKS are PMDK's own
  # required acknowledgment of that trade-off (the build fails without them
  # once NDCTL is off) -- see docs/dev-plan.md's M7 section and
  # src/tr_bake.c's file comment.
  #
  # CMAKE_POLICY_VERSION_MINIMUM=3.5 works around mercury's and flatcc's
  # cmake_minimum_required() predating what CMake 4 accepts -- the same
  # env-var escape hatch ../CMakeLists.txt uses for the vendored flatcc build.
  #
  # Both na+sm (shared memory, needs no network setup) and ofi+tcp are
  # exercised, from one build -- see the two test steps at the end of this
  # job. na+sm gates; ofi+tcp reports.
  # ---------------------------------------------------------------------------
  m4-m7-transport:
    name: M4/M5/M7/M8 transport, rendezvous, queue policy, and subscription (na+sm)
    runs-on: ubuntu-latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      PMEMOBJ_IGNORE_DIRTY_SHUTDOWN: "y"
      PMEMOBJ_IGNORE_BAD_BLOCKS: "y"
    steps:
      - uses: actions/checkout@v4

      - name: Relax Yama ptrace_scope for na+sm
        # na+sm's own small-message path (a few KB, pre-negotiated shared
        # ring buffer) needs no ptrace privilege and works fine under this
        # runner's default kernel.yama.ptrace_scope=1 ("restricted": parent/
        # child only) -- every test here except t_precision passes without
        # this. t_precision's push exceeds that small-message size (the
        # DCPL/type encodings plus the raw payload before any subscriber
        # asks for compression), so Mercury falls back to an RMA get() that
        # calls process_vm_readv() directly -- and that call has been
        # observed failing here with "Kernel Yama configuration does not
        # allow cross-memory attach" even though writer/reader are a plain
        # fork() parent/child (the exact relationship ptrace_scope=1 is
        # supposed to permit, and which works this way every time on a local
        # dev machine with the same ptrace_scope=1 -- not reproduced there).
        # This is a CI-only, ephemeral-VM setting with no real security
        # exposure, so disable the restriction outright rather than chase
        # the exact runner-specific reason ptrace_scope=1 alone isn't
        # sufficient for this one RMA path.
        run: sudo sysctl -w kernel.yama.ptrace_scope=0

      - name: Install build dependencies
        run: |
          # See the mpich/openmpi leg's comment: the preinstalled azure-cli
          # apt source has started 403ing and takes `apt-get update` down
          # with it, so drop it before updating.
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list \
            /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zlib1g-dev \
            libfabric-dev libjson-c-dev libboost-dev libcereal-dev pkg-config autoconf automake libtool \
            uuid-dev pandoc python3-dev python3-numpy

      # HDF5_ENABLE_ZLIB_SUPPORT=ON is required, not cosmetic: HDF5 defaults
      # it OFF, and t_precision/t_precision_dual (M8.5 per-subscriber
      # precision) measure a subscriber-requested GZIP pipeline actually
      # shrinking the wire bytes -- impossible without a real deflate filter.
      # Installing zlib1g-dev above is necessary but NOT sufficient; without
      # this flag H5Pset_deflate() still succeeds (it only records a filter
      # id) and the failure surfaces indirectly as filtered-size == raw-size
      # plus a "required filter is not registered" error from the reader.
      - name: Build HDF5 develop
        run: |
          git clone --depth 1 --branch develop \
            https://github.com/HDFGroup/hdf5.git hdf5-src
          cmake -S hdf5-src -B hdf5-build -G Ninja \
            -DCMAKE_INSTALL_PREFIX=$PWD/hdf5-install \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DHDF5_BUILD_TOOLS=ON \
            -DHDF5_BUILD_EXAMPLES=OFF \
            -DHDF5_BUILD_FORTRAN=OFF \
            -DHDF5_BUILD_CPP_LIB=OFF \
            -DHDF5_ENABLE_ZLIB_SUPPORT=ON
          cmake --build hdf5-build --parallel
          cmake --install hdf5-build

      - name: Build argobots 1.2
        run: |
          curl -sSL https://github.com/pmodels/argobots/releases/download/v1.2/argobots-1.2.tar.gz | tar xz
          cd argobots-1.2
          ./configure --prefix=$HOME/mochi-install
          make -j"$(nproc)" && make install

      - name: Build mercury 2.4.1
        run: |
          curl -sSL https://github.com/mercury-hpc/mercury/releases/download/v2.4.1/mercury-2.4.1.tar.bz2 | tar xj
          cmake -S mercury-2.4.1 -B mercury-build -G Ninja \
            -DCMAKE_INSTALL_PREFIX=$HOME/mochi-install \
            -DCMAKE_PREFIX_PATH=$HOME/mochi-install \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DNA_USE_SM=ON \
            -DNA_USE_OFI=ON \
            -DMERCURY_USE_BOOST_PP=ON
          cmake --build mercury-build --parallel
          cmake --install mercury-build

      - name: Build mochi-margo 0.24.2
        # Autotools (./prepare.sh + ./configure) is gone as of this release --
        # margo build from CMake now, same as mercury and abt-io below.
        run: |
          curl -sSL https://github.com/mochi-hpc/mochi-margo/archive/refs/tags/v0.24.2.tar.gz | tar xz
          PKG_CONFIG_PATH=$HOME/mochi-install/lib/pkgconfig:$HOME/mochi-install/lib64/pkgconfig:$PKG_CONFIG_PATH \
            cmake -S mochi-margo-0.24.2 -B margo-build -G Ninja \
              -DCMAKE_INSTALL_PREFIX=$HOME/mochi-install \
              -DCMAKE_PREFIX_PATH=$HOME/mochi-install \
              -DCMAKE_BUILD_TYPE=Release
          cmake --build margo-build --parallel
          cmake --install margo-build

      - name: Build mochi-thallium 0.17.1
        # Flock's C++ dependency (find_package(thallium REQUIRED)). Needs
        # only cereal (apt, above) and margo (just built) -- no MPI/Python/
        # tests/examples, all off by default.
        run: |
          curl -sSL https://github.com/mochi-hpc/mochi-thallium/archive/refs/tags/v0.17.1.tar.gz | tar xz
          PKG_CONFIG_PATH=$HOME/mochi-install/lib/pkgconfig:$HOME/mochi-install/lib64/pkgconfig:$PKG_CONFIG_PATH \
            cmake -S mochi-thallium-0.17.1 -B thallium-build -G Ninja \
              -DCMAKE_INSTALL_PREFIX=$HOME/mochi-install \
              -DCMAKE_PREFIX_PATH=$HOME/mochi-install \
              -DCMAKE_BUILD_TYPE=Release
          cmake --build thallium-build --parallel
          cmake --install thallium-build

      - name: Build mochi-flock (main)
        # SSG's replacement (src/tr_mercury.c, migrated behind the vs_tr_*
        # seam). Needs margo, json-c (apt, above) and thallium, all already
        # in place; bedrock/MPI/Python/tests/examples stay off by default.
        #
        # Tracks upstream main rather than a release. v0.8.0 serializes the
        # group file through one fixed "<file>.swp" with no locking, and reads
        # the view's member array without the view lock, so concurrent joins
        # race: "Could not rename ... .swp" errors, torn group files, and a
        # SIGSEGV in libflock-server that failed push_fanout_benchmark and
        # detector_narrowing_benchmark here (see issue #1). Fixed on main in
        # 7b484c5 but not yet released. A second concurrent-join crash -- a
        # joiner's provider dereferencing provider->group before init_group()
        # had set it, when another joiner's gossip arrived mid-join
        # (mochi-hpc/mochi-flock#8) -- is fixed on main by #9 (e5921f6,
        # 8a51382), also unreleased; CI carried it as a local patch until
        # then. Pin to the first release that includes both once one ships.
        # Unpinned, so an upstream change can break this job without a
        # vol-stream commit -- the step logs the commit it built.
        run: |
          git clone --depth 1 --branch main https://github.com/mochi-hpc/mochi-flock.git mochi-flock-src
          git -C mochi-flock-src log -1 --format='mochi-flock main at %H (%cs)'
          PKG_CONFIG_PATH=$HOME/mochi-install/lib/pkgconfig:$HOME/mochi-install/lib64/pkgconfig:$PKG_CONFIG_PATH \
            cmake -S mochi-flock-src -B flock-build -G Ninja \
              -DCMAKE_INSTALL_PREFIX=$HOME/mochi-install \
              -DCMAKE_PREFIX_PATH=$HOME/mochi-install \
              -DCMAKE_BUILD_TYPE=Release
          cmake --build flock-build --parallel
          cmake --install flock-build

      - name: Build PMDK 2.1.1
        run: |
          curl -sSL https://github.com/pmem/pmdk/archive/refs/tags/2.1.1.tar.gz | tar xz
          cd pmdk-2.1.1
          make -j"$(nproc)" NDCTL_ENABLE=n EXTRA_CFLAGS="-Wno-error" prefix=$HOME/mochi-install
          make install NDCTL_ENABLE=n EXTRA_CFLAGS="-Wno-error" prefix=$HOME/mochi-install

      - name: Build mochi-abt-io 0.9.0
        run: |
          curl -sSL https://github.com/mochi-hpc/mochi-abt-io/archive/refs/tags/v0.9.0.tar.gz | tar xz
          PKG_CONFIG_PATH=$HOME/mochi-install/lib/pkgconfig:$HOME/mochi-install/lib64/pkgconfig:$PKG_CONFIG_PATH \
            cmake -S mochi-abt-io-0.9.0 -B abt-io-build -G Ninja \
              -DCMAKE_INSTALL_PREFIX=$HOME/mochi-install \
              -DCMAKE_PREFIX_PATH=$HOME/mochi-install \
              -DCMAKE_BUILD_TYPE=Release \
              -DENABLE_BENCHMARK=OFF -DENABLE_EXAMPLES=OFF -DENABLE_TESTS=OFF \
              -DENABLE_LIBURING=OFF -DENABLE_BEDROCK=OFF
          cmake --build abt-io-build --parallel
          cmake --install abt-io-build

      - name: Build mochi-bake 0.6.4
        run: |
          curl -sSL https://github.com/mochi-hpc/mochi-bake/archive/refs/tags/v0.6.4.tar.gz | tar xz
          cd mochi-bake-0.6.4
          ./prepare.sh
          PKG_CONFIG_PATH=$HOME/mochi-install/lib/pkgconfig:$HOME/mochi-install/lib64/pkgconfig:$PKG_CONFIG_PATH \
            ./configure --prefix=$HOME/mochi-install
          make -j"$(nproc)" && make install

      # CPU-only torch, for the volstream.torch.StreamDataset test. The
      # runner's system Python is externally managed, and this is an
      # ephemeral VM, so install into it directly.
      - name: Install torch (CPU)
        run: |
          python3 -m pip install --break-system-packages --quiet torch \
            --index-url https://download.pytorch.org/whl/cpu
          python3 -c "import torch; print('torch', torch.__version__)"

      - name: Build vol-stream with the transport
        run: |
          export PKG_CONFIG_PATH=$HOME/mochi-install/lib/pkgconfig:$HOME/mochi-install/lib64/pkgconfig:$PKG_CONFIG_PATH
          cmake -S . -B build -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/hdf5-install;$HOME/mochi-install" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DVOL_STREAM_ENABLE_MERCURY=ON \
            -DVOL_STREAM_ENABLE_BAKE=ON \
            -DVOL_STREAM_BUILD_PYTHON=ON \
            -DVOL_STREAM_H5DIFF=$PWD/hdf5-install/bin/h5diff
          cmake --build build --parallel

      - name: Test (Mercury round trip, Flock rendezvous, M7 queue policy, and M8 subscription, each as two processes)
        run: |
          LD_LIBRARY_PATH=$HOME/mochi-install/lib:$HOME/mochi-install/lib64:$LD_LIBRARY_PATH \
            ctest --test-dir build --output-on-failure

      # P5 (docs/python-plan.md): the package as a user installs it, with pip,
      # built against this job's HDF5 and Mochi. Tested from outside the
      # source tree. The import check runs without LD_LIBRARY_PATH so a wrong
      # RPATH in the wheel fails here rather than being masked.
      - name: pip install the Python package and test the installed copy
        run: |
          export PKG_CONFIG_PATH=$HOME/mochi-install/lib/pkgconfig:$HOME/mochi-install/lib64/pkgconfig:$PKG_CONFIG_PATH
          # As an environment variable CMAKE_PREFIX_PATH is ':'-separated,
          # unlike the ';'-separated -D form the build step above uses.
          CMAKE_PREFIX_PATH="$PWD/hdf5-install:$HOME/mochi-install" \
            python3 -m pip install --break-system-packages --quiet . \
              -Ccmake.define.VOL_STREAM_ENABLE_MERCURY=ON
          ROOT=$PWD
          cd "$RUNNER_TEMP"
          python3 -c "import volstream, sys; assert '$ROOT' not in volstream.__file__, volstream.__file__; print('installed at', volstream.__file__)"
          # The installed extension's search path must not point into pip's
          # temporary build directory (seen on macOS with Homebrew GCC).
          EXT=$(python3 -c "import volstream._volstream as e; print(e.__file__)")
          readelf -d "$EXT" | grep -E "RPATH|RUNPATH"
          if readelf -d "$EXT" | grep -E "RPATH|RUNPATH" | grep -q "/tmp/"; then
            echo "installed extension's RPATH points into a temporary build directory"; exit 1
          fi
          python3 "$ROOT/python/tests/test_open.py" "$ROOT/build/python/py_stream_fixture"
          LD_LIBRARY_PATH=$HOME/mochi-install/lib:$HOME/mochi-install/lib64:$LD_LIBRARY_PATH \
            python3 "$ROOT/python/tests/test_stream.py" "$ROOT/build/python/py_stream_writer" column

      # An AddressSanitizer build with the transport, which Phase 1's gate
      # asks for and the sanitizer job below cannot give: that job has no
      # Mochi. Only vol-stream is rebuilt with -fsanitize=address; its
      # dependencies are the unsanitized builds above. Leak detection is off,
      # since Mercury and Margo keep allocations for the life of the process;
      # the Python tests are left out, since the interpreter would need
      # libasan preloaded. Its first run was clean (68/68, no reports), so
      # ASan and Argobots' ucontext stack switching get along here: it gates.
      - name: Build with the transport and AddressSanitizer, and test
        run: |
          export PKG_CONFIG_PATH=$HOME/mochi-install/lib/pkgconfig:$HOME/mochi-install/lib64/pkgconfig:$PKG_CONFIG_PATH
          cmake -S . -B build-asan -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/hdf5-install;$HOME/mochi-install" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g" \
            -DVOL_STREAM_ENABLE_MERCURY=ON \
            -DVOL_STREAM_ENABLE_BAKE=ON \
            -DVOL_STREAM_H5DIFF=$PWD/hdf5-install/bin/h5diff
          cmake --build build-asan --parallel
          ASAN_OPTIONS=detect_leaks=0:detect_stack_use_after_return=0 \
          LD_LIBRARY_PATH=$HOME/mochi-install/lib:$HOME/mochi-install/lib64:$LD_LIBRARY_PATH \
            ctest --test-dir build-asan --output-on-failure -E '^python_'

      # Second pass over the same build with a real network transport instead
      # of shared memory -- dev-plan.md's CI matrix calls for both, and na+sm
      # never exercises libfabric at all, so a whole transport's worth of
      # behavior was going untested.
      #
      # Deliberately non-blocking. Every one of these tests passes over
      # ofi+tcp individually (verified 12/12 standalone for the one that
      # flakes), but running them back to back trips the same libfabric
      # teardown residual documented in test/t_precision_dual.c: an unbounded
      # connect() to an already-departed peer can stall a subsequent test's
      # rendezvous. Roughly one run in three saw a single test time out.
      #
      # Gating on that would import a known third-party flake into every PR.
      # Reporting it does not: a regression that broke ofi+tcp outright would
      # still be plainly visible in the log, which is the coverage actually
      # wanted here. Revisit if the residual is ever fixed upstream.
      # Scoped to the transport tests on purpose. VOL_STREAM_NA turns the
      # transport on for *every* file the connector opens, so running the
      # whole suite under it also forces one onto tests that are not about
      # the transport at all -- and t_step's M0/M1 gate then fails, because
      # a transport-enabled writer's file is not byte-identical to native
      # (same objects and same data, but ~179 bytes of different internal
      # allocation). That is a real and previously undocumented limit of the
      # byte-identity promise rather than an ofi+tcp problem -- na+sm
      # perturbs it identically -- so it is written up in dev-plan.md, not
      # papered over here. Either way it is noise in this step, which exists
      # to exercise libfabric.
      - name: Test over ofi+tcp (non-blocking -- see comment)
        continue-on-error: true
        run: |
          VOL_STREAM_NA=ofi+tcp \
          LD_LIBRARY_PATH=$HOME/mochi-install/lib:$HOME/mochi-install/lib64:$LD_LIBRARY_PATH \
            ctest --test-dir build --output-on-failure \
              -R 'transport|rendezvous|queue_policy|subscribe|precision$|chunk_zerocopy|subvolume_nd|strided_write|schema|python_stream|python_lifecycle'

  # ---------------------------------------------------------------------------
  # Sanitizers. A background progress thread plus a step queue is the classic
  # place for races, so TSan is in the matrix before the queue exists rather
  # than after it misbehaves.
  #
  # Deliberately does not build with VOL_STREAM_ENABLE_MERCURY (Mercury is not
  # installed in this job, so CMakeLists.txt's AUTO detection leaves it off
  # regardless): Argobots' ucontext-based user-level threading has no TSan
  # fiber-switch annotations, so the moment it actually spins up an execution
  # stream, ThreadSanitizer segfaults trying to track a stack switch it
  # doesn't understand -- a tooling incompatibility, not a vol-stream race.
  # Confirmed locally: t_deferred (M4's other new code path, no Argobots
  # involved) passes clean under TSan; only t_transport/t_rendezvous crash,
  # and only under thread. The m4-m7-transport job above exercises the
  # transport (and M7's queue policy) instead, without sanitizers.
  # ---------------------------------------------------------------------------
  sanitizers:
    name: ${{ matrix.san }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        san: [address, undefined, thread]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          # See the mpich/openmpi leg's comment: the preinstalled azure-cli
          # apt source has started 403ing and takes `apt-get update` down
          # with it, so drop it before updating.
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list \
            /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zlib1g-dev

      # Ubuntu's libhdf5-dev is 1.10.10, below the 1.14 floor CMakeLists.txt
      # enforces, so find_package(HDF5) fails before the sanitizer build ever
      # starts. Build develop instead of relying on the system package --
      # same version the main matrix uses, since older releases aren't a
      # support target. HDF5_BUILD_TOOLS=ON so h5diff exists for t_replay.
      - name: Build HDF5 develop
        run: |
          git clone --depth 1 --branch develop \
            https://github.com/HDFGroup/hdf5.git hdf5-src
          cmake -S hdf5-src -B hdf5-build -G Ninja \
            -DCMAKE_INSTALL_PREFIX=$PWD/hdf5-install \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DHDF5_BUILD_TOOLS=ON \
            -DHDF5_BUILD_EXAMPLES=OFF \
            -DHDF5_BUILD_FORTRAN=OFF \
            -DHDF5_BUILD_CPP_LIB=OFF \
            -DHDF5_ENABLE_ZLIB_SUPPORT=ON
          cmake --build hdf5-build --parallel
          cmake --install hdf5-build

      - name: Build with -fsanitize=${{ matrix.san }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_PREFIX_PATH=$PWD/hdf5-install \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=${{ matrix.san }} -fno-omit-frame-pointer -g" \
            -DVOL_STREAM_H5DIFF=$PWD/hdf5-install/bin/h5diff
          cmake --build build --parallel

      - name: Smoke test
        run: ctest --test-dir build --output-on-failure
